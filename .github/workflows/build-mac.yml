name: Build FastClicker (macOS)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app
        working-directory: FastClickerMac
        run: ./build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FastClicker-macOS
          path: FastClickerMac/build/FastClicker-macOS.zip
